{% extends "base.html" %}
{% block content %}
<div class="level"><div class="level-left"><h1 class="title">Lista de Videojuegos</h1></div><div class="level-right"><a href="#" class="button is-primary">+ Agregar Juego</a></div></div>
<table class="table is-fullwidth is-striped"><thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Acciones</th></tr></thead><tbody>{% for juego in juegos %}<tr><td>{{ juego.id }}</td><td><b>{{ juego.nombre }}</b></td><td>{{ juego.descripcion }}</td><td>${{ juego.precio }}</td><td><a href="#" class="button is-small is-warning">Editar</a> <a href="#" class="button is-small is-danger">Eliminar</a></td></tr>{% else %}<tr><td colspan="5" class="has-text-centered">No hay juegos registrados.</td></tr>{% endfor %}</tbody></table>
{% endblock %}
